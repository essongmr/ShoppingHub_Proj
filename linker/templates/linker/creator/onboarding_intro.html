<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store 소개 | ShoppingHub</title><style>:root{--blue:#3568d4;--ink:#1d2940;--muted:#6e7d93;--line:#dce5f1}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:linear-gradient(135deg,#f7fbff,#fffaf5)}.shell{max-width:1180px;margin:auto;padding:24px 28px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,430px);gap:70px;align-items:center;min-height:680px}.brand{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-decoration:none}.stage{max-width:610px}.kicker{color:var(--blue);font-size:12px;font-weight:800}.stage h1{font-size:clamp(32px,4vw,48px);line-height:1.24;margin:15px 0}.lead{color:var(--muted);line-height:1.75}.card,.phone{background:#fffdfc;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px #29436b0d}.card{padding:25px;margin-top:25px}.hint{color:var(--muted);font-size:13px}.answer{width:100%;min-height:110px;border:1px solid #cbd8e8;border-radius:11px;padding:14px;font:inherit;resize:vertical}.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.suggestion,.text-action{border:1px solid #d7e1ec;border-radius:99px;background:#fff;color:#5d6d80;padding:9px 11px;cursor:pointer;font:inherit;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.btn{display:inline-block;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:13px 17px;text-decoration:none;font:inherit;cursor:pointer;min-height:46px}.btn.light{background:#edf3ff;color:var(--blue)}.phone{overflow:hidden}.phone-bar{height:20px;background:#fbfdff;border-bottom:1px solid #e7edf4}.store{text-align:center;background:#fff;padding:32px 26px;min-height:540px}.avatar{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f6c9b6,#ddedff);color:#fff;font-size:25px}.avatar:before{content:"✦"}.store h2{font-size:24px;margin:0 0 7px}.store p{color:var(--muted);font-size:14px;line-height:1.6}.pills span{display:inline-block;background:#eef3fa;color:#5e6f84;border-radius:99px;padding:6px 9px;margin:5px 2px;font-size:11px}.search{background:#f3f6f9;color:#9aa6b5;border-radius:10px;text-align:left;padding:12px;margin:24px 0;font-size:12px}.empty{background:#f8fafc;border-radius:13px;padding:38px 12px;color:#7b899a;font-size:12px;line-height:1.7}.empty strong{display:block;color:#526070;margin-bottom:4px}@media(max-width:800px){.shell{padding:18px 16px 30px}.layout{display:flex;flex-direction:column;align-items:stretch;gap:28px;min-height:0;padding-top:35px}.stage{max-width:none}.stage h1{font-size:31px}.card{padding:20px}.phone{max-width:430px;width:100%;margin:auto}.actions .btn{width:100%;text-align:center}}
</style></head>
<body><main class="shell"><a class="brand" href="{% url 'creator_onboarding_profile' %}">SHOPPINGHUB / CREATOR</a><div class="layout"><section class="stage"><div class="kicker">04 / 06</div><h1>어떤 상품을 소개하는<br>Store인가요?</h1><p class="lead">고객에게 보여줄 짧은 소개를 만들어볼게요.</p><div class="card"><p class="hint">이렇게 소개해볼까요?</p><form method="post">{% csrf_token %}<textarea class="answer" name="tagline" id="tagline-input" placeholder="생활이 조금 더 편해지는 아이템을 소개합니다.">{{ form.tagline.value|default:'' }}</textarea><p class="hint">이런 소개도 잘 어울려요.</p><div class="suggestions"><button class="suggestion" type="button">생활을 편하게 만드는 아이템</button><button class="suggestion" type="button">써보고 좋았던 제품만 소개해요</button><button class="suggestion" type="button">알아두면 좋은 생활템을 모았어요</button></div><div class="actions"><button class="btn" type="submit">좋아요, 다음 →</button><button class="text-action" type="submit" name="skip" value="1">지금은 건너뛸게요</button></div></form></div></section><aside class="phone"><div class="phone-bar"></div><div class="store"><div class="avatar"></div><h2>{{ store.store_name }}</h2><p id="tagline-preview">{{ store.tagline|default:'소개를 한 줄로 채워보세요.' }}</p><div class="pills"><span>Instagram</span><span>YouTube</span></div><div class="search">상품번호 · 상품명 · 브랜드 검색</div><div class="empty"><strong>아직 진열된 상품이 없어요.</strong>첫 상품을 진열하면 여기에 보여드릴게요.</div></div></aside></div></main><script>var input=document.getElementById('tagline-input');var preview=document.getElementById('tagline-preview');input.addEventListener('input',function(){preview.textContent=input.value||'소개를 한 줄로 채워보세요.'});document.querySelectorAll('.suggestion').forEach(function(button){button.addEventListener('click',function(){input.value=button.textContent;input.dispatchEvent(new Event('input'))})});</script></body></html>
