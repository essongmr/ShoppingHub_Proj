<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 | ShoppingHub</title>
<style>
:root{--blue:#2563eb;--blue-700:#1d4ed8;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--soft:#f7f9fc}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;background:var(--soft);color:var(--ink);font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif}
.login-page{min-height:100vh;display:grid;place-items:center;padding:32px 18px}
.login-wrap{width:min(100%,440px)}
.brand{text-align:center;margin-bottom:24px}
.brand-mark{width:44px;height:44px;border-radius:13px;margin:0 auto 12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:900}
.brand h1{margin:0;color:#0f172a;font-size:28px;line-height:1.2}
.brand p{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.6}
.login-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 45px rgba(15,23,42,.08);padding:28px}
.form-errors,.field-errors{margin:0 0 14px;padding:11px 12px;border-radius:10px;background:#fff1f2;color:#be123c;font-size:13px;line-height:1.5}
.field{display:block;margin-bottom:16px;color:#334155;font-size:13px;font-weight:800}
.field input{width:100%;height:48px;margin-top:7px;border:1px solid #cbd5e1;border-radius:11px;padding:0 13px;color:var(--ink);font:inherit;background:#fff}
.field input:focus{outline:3px solid #dbeafe;border-color:var(--blue)}
.field .helptext{display:none}
.primary{width:100%;height:48px;border:0;border-radius:11px;background:var(--blue);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.primary:hover{background:var(--blue-700)}
.signup{margin:18px 0 0;text-align:center;color:var(--muted);font-size:14px}
.signup a{color:var(--blue);font-weight:800;text-decoration:none}
.signup a:hover{text-decoration:underline}
@media(max-width:480px){.login-page{align-items:start;padding-top:40px}.login-card{padding:22px;border-radius:15px}.brand h1{font-size:25px}}
</style>
</head>
<body>
<main class="login-page">
  <div class="login-wrap">
    <header class="brand">
      <div class="brand-mark">S</div>
      <h1>ShoppingHub</h1>
      <p>콘텐츠와 상품을 연결하는 나만의 쇼핑 허브</p>
    </header>
    <section class="login-card" aria-label="ShoppingHub 로그인">
      <form method="post" novalidate>
        {% csrf_token %}
        {% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
        <label class="field">아이디{{ form.username }}{% if form.username.errors %}<span class="field-errors">{{ form.username.errors }}</span>{% endif %}</label>
        <label class="field">비밀번호{{ form.password }}{% if form.password.errors %}<span class="field-errors">{{ form.password.errors }}</span>{% endif %}</label>
        <button class="primary" type="submit">ShoppingHub 시작하기</button>
      </form>
      <p class="signup">아직 계정이 없으신가요? <a href="{% url 'signup' %}">회원가입</a></p>
    </section>
  </div>
</main>
</body>
</html>
