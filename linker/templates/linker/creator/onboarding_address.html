<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store 주소 | ShoppingHub</title><style>:root{--blue:#3568d4;--ink:#1d2940;--muted:#6e7d93;--line:#dce5f1}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:linear-gradient(135deg,#f7fbff,#fffaf5)}.shell{max-width:760px;margin:auto;padding:24px 28px}.brand{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-decoration:none}.stage{margin-top:100px}.kicker{color:var(--blue);font-size:12px;font-weight:800}.stage h1{font-size:clamp(32px,5vw,48px);line-height:1.2;margin:15px 0}.lead{color:var(--muted);line-height:1.7} .card{margin-top:28px;background:#fffdfc;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px #29436b0d;padding:30px;text-align:center}.domain{color:var(--muted);font-size:14px}.address{font-size:29px;margin:10px 0 12px}.input{width:100%;border:1px solid #cbd8e8;border-radius:11px;padding:14px;font:inherit}.btn{display:inline-block;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:13px 17px;font:inherit;cursor:pointer;margin-top:18px;width:100%}.errorlist{list-style:none;color:#b24d5b;padding:0;font-size:13px}@media(max-width:800px){.shell{padding:18px 16px}.stage{margin-top:65px}.card{padding:22px}.address{font-size:24px}}
</style></head><body><main class="shell"><a class="brand" href="{% url 'creator_onboarding_intro' %}">SHOPPINGHUB / CREATOR</a><section class="stage"><div class="kicker">05 / 06</div><h1>이제 거의 다 됐어요.</h1><p class="lead">Store 주소도 준비했어요.</p><div class="card"><div class="domain">ShoppingHub</div><div class="address">shoppinghub / {{ store.slug }}</div><p class="lead">이 주소로 고객들이<br>내 Store를 찾아올 수 있어요.</p><form method="post">{% csrf_token %}<button class="btn" type="submit">이 주소 좋아요 →</button></form></div></section></main></body></html>
