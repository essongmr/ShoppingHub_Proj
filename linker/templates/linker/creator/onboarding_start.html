<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShoppingHub 가입</title>
<style>
:root{--blue:#3568d4;--ink:#1d2940;--muted:#6e7d93;--line:#dce5f1}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:radial-gradient(circle at 84% 12%,#e8e5ff 0,transparent 31%),radial-gradient(circle at 10% 84%,#e4f1ff 0,transparent 30%),linear-gradient(135deg,#f7fbff,#fffaf5)}.shell{max-width:1180px;margin:auto;padding:24px 28px 44px}.brand{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-decoration:none}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,430px);gap:70px;align-items:center;min-height:680px}.stage{max-width:610px}.kicker{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.06em}.stage h1{font-size:clamp(32px,4vw,48px);line-height:1.24;margin:15px 0}.lead{color:var(--muted);line-height:1.75;margin:0}.card{background:#fffdfc;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px #29436b0d;padding:25px;margin-top:25px}.field{display:block;color:var(--muted);font-size:13px;font-weight:700;margin:13px 0}.input{width:100%;border:1px solid #cbd8e8;border-radius:11px;padding:14px;font:inherit;background:#fff;color:var(--ink);margin-top:7px}.input:focus{outline:3px solid #dfe8ff;border-color:var(--blue)}.errorlist{list-style:none;padding:0;margin:6px 0;color:#b24d5b;font-size:13px;line-height:1.5}.btn{display:inline-block;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:13px 17px;text-decoration:none;font:inherit;cursor:pointer;min-height:46px;width:100%;margin-top:8px}.form-errors{padding:12px 14px;border-radius:10px;background:#fff0f1;color:#a34554;font-size:13px;line-height:1.5}.concept{position:relative;min-height:410px;padding:24px;display:grid;place-items:center}.concept-store{position:relative;width:min(100%,390px);padding:30px 22px 24px;background:#fff;border:1px solid #dfe6f1;border-radius:24px;box-shadow:0 20px 45px #2b47751a;text-align:center}.concept-store:before{content:"";position:absolute;inset:18px -14px -14px 18px;border:1px solid #d9d3f5;border-radius:22px;z-index:-1}.concept-flow{display:flex;gap:8px;justify-content:center;margin:22px 0 14px}.concept-card{flex:1;padding:14px 8px;background:linear-gradient(150deg,#f7fbff,#f5f1ff);border:1px solid #e1e7f4;border-radius:13px;color:var(--blue);font-weight:700;font-size:12px}.concept-card b{display:block;font-size:23px;margin-bottom:7px}.concept-caption{font-size:18px;font-weight:800;line-height:1.45;margin:18px 0 0}.login{margin-top:17px;color:var(--muted);font-size:13px;text-align:center}.login a{color:var(--blue)}@media(max-width:800px){.shell{padding:18px 16px 30px}.layout{display:flex;flex-direction:column;align-items:stretch;gap:30px;min-height:0;padding-top:45px}.stage{max-width:none}.stage h1{font-size:31px}.card{padding:20px}.concept{order:2;min-height:300px;padding:5px}.concept-store{max-width:360px}.concept-flow{gap:5px}.concept-card{padding:11px 4px;font-size:11px}}
</style>
</head>
<body>
<main class="shell"><a class="brand" href="{% url 'shoppinghub_entry' %}">SHOPPINGHUB / CREATOR</a><div class="layout"><section class="stage"><div class="kicker">01 / 06</div><h1>소개한 상품이 쌓이는 곳,<br>나만의 ShoppingHub Store를 시작하세요.</h1><p class="lead">SNS에서 소개한 상품을 모아두면<br>고객이 언제든 다시 찾아볼 수 있어요.</p><div class="card"><form method="post" novalidate>{% csrf_token %}{% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}<label class="field">사용자명{{ form.username }}{{ form.username.errors }}</label><label class="field">이메일{{ form.email }}{{ form.email.errors }}</label><label class="field">비밀번호{{ form.password1 }}{{ form.password1.errors }}</label><label class="field">비밀번호 확인{{ form.password2 }}{{ form.password2.errors }}</label><button class="btn" type="submit">무료로 시작하기</button></form><p class="login">이미 계정이 있나요? <a href="{% url 'login' %}">로그인</a></p></div></section><aside class="concept"><div class="concept-store"><div class="kicker">SHOPPINGHUB</div><div class="concept-flow"><div class="concept-card"><b>+</b>모으고</div><div class="concept-card"><b>✦</b>진열하고</div><div class="concept-card"><b>↗</b>연결해요</div></div><p class="concept-caption">당신이 소개한 상품이<br>하나의 Store가 됩니다.</p></div></aside></div></main>
</body>
</html>
